# Async adapter only works within the same process — separate bin/jobs workers
# cannot broadcast to browser connections served by Puma. Use solid_cable in
# development so Queue → Cable updates reach the feed.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
